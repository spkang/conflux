[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/terminal",
  "crates/files",
  "crates/webpanel",
  "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/conflux"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
